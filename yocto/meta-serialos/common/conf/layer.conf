# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-serialos"
BBFILE_PATTERN_meta-serialos = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-serialos = "100"

LAYERDEPENDS_meta-serialos = " \
    core \
"
LAYERSERIES_COMPAT_meta-serialos = "wrynose"
