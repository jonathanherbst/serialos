#@TYPE: Machine
#@NAME: BeagleBone machine
#@DESCRIPTION: Machine configuration for the http://beagleboard.org/bone board

require conf/machine/beaglebone-yocto.conf

WKS_FILES = "sdimage-2part.wks"
DTB_FILES = "serialos-bbb.dtb"

# out-of-tree devicetree provides serialos-bbb.dtb; no kernel dtbs needed
KERNEL_DEVICETREE = ""

# drop kernel-devicetree from essential rdeps; we supply our own dtb via
# serialos-bbb-devicetree (devicetree bbclass) instead of kernel-built dtbs
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-image"

# Generate an extlinux.conf file
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_ROOT = "root=PARTUUID=${uuid}"
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait rw earlycon"
UBOOT_EXTLINUX_BOOT_FILES = " \
    extlinux.conf;extlinux/extlinux.conf \
    ${KERNEL_IMAGETYPE} \
    devicetree/${DTB_FILES} \
"
UBOOT_EXTLINUX_FDT = "../devicetree/${DTB_FILES}"

# devicetree bbclass deploys to <deploy>/devicetree/, so reference it there
IMAGE_BOOT_FILES = "extlinux.conf;extlinux/extlinux.conf u-boot.${UBOOT_SUFFIX} ${SPL_BINARY} ${KERNEL_IMAGETYPE} devicetree/${DTB_FILES}"

EXTRA_IMAGEDEPENDS += "serialos-bbb-devicetree"
