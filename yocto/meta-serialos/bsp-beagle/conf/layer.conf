# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-serialos-beagle"
BBFILE_PATTERN_meta-serialos-beagle = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-serialos-beagle = "100"

LAYERDEPENDS_meta-serialos-beagle = " \
    meta-beagle \
"
LAYERSERIES_COMPAT_meta-serialos-beagle = "scarthgap"