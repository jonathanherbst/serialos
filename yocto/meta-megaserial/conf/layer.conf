# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-megaserial"
BBFILE_PATTERN_meta-megaserial = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-megaserial = "100"

LAYERDEPENDS_meta-megaserial = " \
    core \
"
LAYERSERIES_COMPAT_meta-megaserial = "scarthgap"
