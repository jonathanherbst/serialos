#@TYPE: Machine
#@NAME: BeagleBone machine
#@DESCRIPTION: Machine configuration for the http://beagleboard.org/bone board

DEFAULTTUNE ?= "cortexa8hf-neon"
include conf/machine/include/arm/armv7a/tune-cortexa8.inc

MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"

PREFERRED_PROVIDER_virtual/kernel = "linux-megaserial"
PREFERRED_VERSION_linux-bb.org = "6.6%"

DT_VENDOR_PREFIX = "ti/omap/"

IMAGE_FSTYPES = "tar.xz wic.xz wic.bmap"
WKS_FILES = "sdimage-2part.wks"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image kernel-devicetree"
do_image_wic[depends] += "mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot virtual/bootloader:do_deploy"

KERNEL_IMAGETYPE = "zImage"
DTB_FILES = "am335x-boneblack.dtb"
KERNEL_DEVICETREE = '${@' '.join('ti/omap/%s' % d for d in '${DTB_FILES}'.split())}'
DEVICETREE_FILE = "${@(d.getVar('KERNEL_DEVICETREE') or "").replace("ti/omap/","")}"

EXTRA_IMAGEDEPENDS += "megaserial-bbb-overlay"

PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"

SPL_BINARY = "MLO"
UBOOT_SUFFIX = "img"
UBOOT_MACHINE = "am335x_evm_defconfig"

UBOOT_ENTRYPOINT = "0x80008000"
UBOOT_LOADADDRESS = "0x80008000"

# Generate an extlinux.conf file
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_ROOT = "root=PARTUUID=${uuid}"
UBOOT_EXTLINUX_KERNEL_ARGS = "rootwait rw earlycon"
UBOOT_EXTLINUX_BOOT_FILES = " \
    extlinux.conf;extlinux/extlinux.conf \
    ${KERNEL_IMAGETYPE} \
    ${DEVICETREE_FILE} \
"

MACHINE_FEATURES = "usbgadget usbhost vfat alsa"

IMAGE_BOOT_FILES ?= "\
    extlinux.conf;extlinux/extlinux.conf \
    u-boot.${UBOOT_SUFFIX}\
    ${SPL_BINARY}\
    ${KERNEL_IMAGETYPE}\
    ${DTB_FILES}\
    devicetree/megaserial-bbb.dtbo\
"

UBOOT_EXTLINUX_FDTOVERLAYS = "${UBOOT_EXTLINUX_FDTDIR}devicetree/megaserial-bbb.dtbo"

SERIAL_CONSOLES = "115200;ttyS0"
